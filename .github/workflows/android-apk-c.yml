name: Android APK C

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rename APK
        id: apk
        run: |
          NAME="IPMAgo-${GITHUB_REF_NAME//\//-}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipmago-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            Install on Android: download `${{ steps.apk.outputs.path }}` and open it
            (you may need to allow "Install unknown apps" for your browser or file manager).

            This APK is release-optimized but signed with the Expo template's debug keystore,
            so it is meant for sideloading, not for Google Play.
