name: Android APK B

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Bump versionCode
        run: |
          node -e "const fs=require('fs');const cfg=JSON.parse(fs.readFileSync('app.json','utf8'));cfg.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);fs.writeFileSync('app.json',JSON.stringify(cfg,null,2)+'\n')"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
