name: Android APK A

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: android-apk-a-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
