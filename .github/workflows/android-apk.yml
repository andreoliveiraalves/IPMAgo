name: Android APK

# Builds a release APK with Gradle and attaches it to a GitHub Release.
# Trigger: push a v* tag, or run manually from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Bump versionCode
        run: |
          node -e "const fs=require('fs');const cfg=JSON.parse(fs.readFileSync('app.json','utf8'));cfg.expo.android.versionCode=Number(process.env.GITHUB_RUN_NUMBER);fs.writeFileSync('app.json',JSON.stringify(cfg,null,2)+'\n')"

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        id: apk
        run: |
          NAME="IPMAgo-${GITHUB_REF_NAME//\//-}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipmago-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          body: |
            Install on Android: download `${{ steps.apk.outputs.path }}` and open it
            (you may need to allow "Install unknown apps" for your browser or file manager).

            This APK is release-optimized but signed with the Expo template's debug keystore,
            so it is meant for sideloading, not for Google Play.
