name: APK smoke test

# Diagnostic build: installs a release APK on an emulator and captures logcat.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Generate native project
        run: npx expo prebuild --platform android --clean --no-install
        env:
          CI: '1'

      - name: Build release APK for both ABIs
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64,arm64-v8a

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n com.ipmago.app/.MainActivity
            sleep 15
            adb shell pidof com.ipmago.app > pid.txt 2>&1 || true
            adb logcat -d -v brief > logcat.txt
            cat pid.txt
            grep -E "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS" logcat.txt | head -150 || true
            # The process must still be alive: an empty pid.txt means it crashed
            # on start (that is how the v1.0.3 WorkManager/R8 crash was found).
            test -s pid.txt
            ! grep -q "FATAL EXCEPTION" logcat.txt

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: |
            logcat.txt
            pid.txt
          if-no-files-found: warn
